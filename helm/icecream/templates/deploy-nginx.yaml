apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: icecream-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: {{ .Values.nginx.image }}:{{ .Values.nginx.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: 80

