name: AUTH SERVICE CD

on:
  push:
    branches:
      - main
    paths:
      - 'services/auth-service/**'
      - 'helm/icecream/**'

jobs:
  build-push-and-update-manifest:
    name: Build, Push and Update values.yaml (GitOps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: services/auth-service
          push: true
          tags: akhilmylaram/icecream-auth-service:${{ github.sha }}
          cache-from: type=registry,ref=akhilmylaram/icecream-auth-service:buildcache
          cache-to: type=registry,ref=akhilmylaram/icecream-auth-service:buildcache,mode=max

      - name: Install yq
        uses: mikefarah/yq@master

      - name: Update Helm Tag in values.yaml
        run: yq e ".authService.tag = \"${{ github.sha }}\"" -i helm/icecream/values.yaml

      - name: Update Helm Image in values.yaml
        run: yq e ".authService.image = \"akhilmylaram/icecream-auth-service\"" -i helm/icecream/values.yaml

      - name: Configure Git Bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Stage Manifest Changes
        run: git add helm/icecream/values.yaml

      - name: Commit Manifest Changes
        run: git commit -m "chore: update auth-service image to ${{ github.sha }} [skip ci]"

      - name: Push Changes to Remote
        run: git push origin HEAD:${{ github.ref }}
