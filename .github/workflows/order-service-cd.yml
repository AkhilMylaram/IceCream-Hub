name: ORDER SERVICE CD

on:
  push:
    branches:
      - main
    paths:
      - 'services/order-service/**'
      - 'helm/icecream/**'

jobs:
  build-push-and-update-manifest:
    name: Build, Push and Update values.yaml (GitOps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: services/order-service
          push: true
          tags: akhilmylaram/icecream-order-service:${{ github.sha }}
          cache-from: type=registry,ref=akhilmylaram/icecream-order-service:buildcache
          cache-to: type=registry,ref=akhilmylaram/icecream-order-service:buildcache,mode=max

      - name: Install yq
        uses: mikefarah/yq@master

      - name: Update Helm values.yaml
        run: |
          yq e ".orderService.tag = \"${{ github.sha }}\"" -i helm/icecream/values.yaml
          yq e ".orderService.image = \"akhilmylaram/icecream-order-service\"" -i helm/icecream/values.yaml

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/icecream/values.yaml
          git commit -m "chore: update order-service image to ${{ github.sha }} [skip ci]"
          git push origin HEAD:${{ github.ref }}
