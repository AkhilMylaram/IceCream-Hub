# Triggering CI/CD pipeline check
name: CART SERVICE CD

on:
  push:
    branches:
      - main
    paths:
      - 'services/cart-service/**'
      - 'helm/icecream/**'

concurrency:
  group: cd-pipeline
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: services/cart-service
          push: true
          tags: akhilmylaram/icecream-cart-service:${{ github.sha }}
          cache-from: type=registry,ref=akhilmylaram/icecream-cart-service:buildcache
          cache-to: type=registry,ref=akhilmylaram/icecream-cart-service:buildcache,mode=max

  update-manifest:
    name: Update Helm Manifest
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install yq
        uses: mikefarah/yq@master

      - name: Setup Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Modify values.yaml
        run: |
          yq e ".cartService.tag = \"${{ github.sha }}\"" -i helm/icecream/values.yaml
          yq e ".cartService.image = \"akhilmylaram/icecream-cart-service\"" -i helm/icecream/values.yaml

      - name: Commit and Rebase-Push
        run: |
          git add helm/icecream/values.yaml
          git commit -m "chore: update cart-service image to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin HEAD:${{ github.ref }}
